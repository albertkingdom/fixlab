[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixlab"
version = "0.1.0"
description = "教學導向的最小 CLI coding agent，修多檔小專案的 bug"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "pytest",  # run_tests 執行時需要它
    "regex",
]

[project.optional-dependencies]
# 呼叫外部 MCP server 的工具（--mcp-config）。官方 SDK 依賴很多，所以做成選用：pip install 'fixlab[mcp]'
mcp = ["mcp>=2.3,<3"]

[project.scripts]
fixlab = "fixlab.cli:main"

# 自動尋找 fixlab 底下的子套件（例如 fixlab.bench）；固定清單在一般安裝時會漏掉子套件。
[tool.setuptools.packages.find]
include = ["fixlab", "fixlab.*"]
# 沒有 __init__.py 的資料夾不算套件，打包內容才和 fixlab 底下的套件目錄一致。
namespaces = false

[tool.pytest.ini_options]
# 覆寫 norecursedirs 會蓋掉 pytest 的預設值，所以把預設裡需要的（.*、venv 等）一起列出。
# tests/fixtures 與 bench/problems 是給 agent 修的專案，裡面的測試本來就會失敗，不能被 fixlab 自己的 pytest 收集。
norecursedirs = [".*", "*.egg", "build", "dist", "venv", "tests/fixtures", "bench/problems"]
